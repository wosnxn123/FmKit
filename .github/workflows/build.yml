name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'shop-v*' ]
  pull_request:


permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 'v*' stays FmKit's release prefix (v1.1.0 .. v1.1.2 already published);
          # FmShop releases carry 'shop-v*' so one plugin's tag never ships the other's jar.
          - module: FmKit
            tag_prefix: refs/tags/v
          - module: FmShop
            tag_prefix: refs/tags/shop-v
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build
        run: mvn -B -ntp package
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.module }}
          path: ${{ matrix.module }}/target/*.jar
      - name: Release
        if: startsWith(github.ref, matrix.tag_prefix)
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.module }}/target/*.jar
