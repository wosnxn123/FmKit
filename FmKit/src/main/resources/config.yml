# 个人回收开关
collect:
  enabled: true          # 总开关：私人箱收集（死亡标记+扫地分流）
  default: true          # 每位玩家回收开关初始值（/fmkit toggle 或 GUI 槽2 可改）
  on-death: true       # 死亡掉落是否收进私人回收站

# 回收站
bins:
  private-ttl-days: 3        # 游戏日（1游戏日=20分钟）
  public-ttl-days: 7
  private-max-entries: 0     # 私人箱容量，0=不限；满则最旧条目提前转公共
  public-max-entries: 512    # 公共箱容量，满则淘汰最旧；0=不限
  expiry-scan-interval: 60   # 到期流转/清理扫描周期（秒）
  move-notify: VALUABLE      # 到期提醒初始档：OFF | VALUABLE | ALL（旧 true=ALL / false=OFF 仍兼容）
  move-notify-mode: ACTIONBAR  # ACTIONBAR | CHAT
  notify-max-shown: 3        # 到期提醒最多按名展示几种物品，0=只报数量
  expiry-warn-seconds: 60    # 到期前 N 秒发一次倒计时提醒，0=关闭
  expiry-preview-minutes: 10 # 到期预览按钮的时间窗（分钟）
  expiry-destroy: false      # 到期去向初始值：到期后自动销毁（私人箱槽5 按玩家可切换）
  destroy-confirm-seconds: 3 # 销毁两步确认窗口（秒）

# GUI
gui:
  sounds: true
  auto-refresh-seconds: 2    # GUI 打开期间自动重绘周期（秒），倒计时/悬停预览保持新鲜；0=关闭
  frame-material: GRAY_STAINED_GLASS_PANE
  dark-bar-material: BLACK_STAINED_GLASS_PANE
  icons:
    banner: WRITABLE_BOOK
    toggle-on: LIME_CONCRETE
    toggle-off: RED_CONCRETE
    expiry-to-public: CHEST
    expiry-destroy: FIRE_CHARGE
    switch-to-public: CHEST
    switch-to-private: ENDER_CHEST
    prev-page: ARROW
    next-page: ARROW
    page-indicator: PAPER
    refresh: CLOCK
    take-all: LIME_SHULKER_BOX
    sort: HOPPER
    hub-private: ENDER_CHEST
    hub-public: CHEST
    notify-valuable: YELLOW_CONCRETE
    preview: SPYGLASS

# 管理
admin:
  clearpublic-confirm-seconds: 10

