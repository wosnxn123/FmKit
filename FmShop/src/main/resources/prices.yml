# ===========================================================================
#  FmShop 价格表
#
#  buy  = 玩家买入价（每个），0 或缺省 = 不出售
#  sell = 玩家卖出价（每个），0 或缺省 = 不回收
#
#  【核心不变量】全表遵守 buy = 2 × sell。
#  这个 100% 的买卖差价是反套利的根基：任何合成配方的产物价值不会超过
#  材料价值之和，而材料买入价已是其卖出价的两倍，所以“买材料 → 合成 → 卖产物”
#  永远亏损。方块类（9 合 1）按 9 倍精确定价，熔炼类保证“产物卖价 ≤ 原料买价”。
#  /fsa doctor 会用服务器真实配方表复核全部组合，改价后请务必运行一次。
#
#  【定价梯度】按“获取难度 / 可自动化程度”分档，而非按稀有度：
#    刷怪塔、铁傀儡农场、作物农场等可无限自动化产出的物品定价极低；
#    受时运影响的矿物已按时运 III 的期望产量（约 2.2 倍）折算；
#    无法量产的（下界之星、鞘壳、鞘翅）价格高，部分只卖不收作为金币回收口。
#
#  daily-buy / daily-sell = 每名玩家每日限额（件），0 = 不限
#  dynamic.enabled        = 该商品价格随交易量浮动（买入推高、卖出压低）
# ===========================================================================

dynamic-defaults:
  enabled: false
  # 每交易 1 件物品，行情变动的基点数（100 基点 = 1%）
  step-bp: 2
  floor-percent: 50
  ceil-percent: 200
  # 每小时向 100% 回归的基点数
  recover-bp-per-hour: 300

