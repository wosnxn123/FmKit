# ===========================================================================
#  FmShop 价格表 —— 全物品表（1374 件，15 个分类）
#  另有 128 本附魔书由文件末尾附近的 enchanted-books 区段按曲线展开，不逐条写在 items: 里
#
#  buy  = 玩家买入价（每个），0 或缺省 = 不出售
#  sell = 玩家卖出价（每个），0 或缺省 = 不回收
#
#  【核心不变量】全表 buy = 2 × sell（个别注明的例外只会更保守）。
#
#  【价格怎么来的】非天然物品的买价由服务器真实配方递推：
#     buy(产物) = 1.25 × min(配方里每个格子最便宜合法材料的买价之和) / 产量
#  回收率 50% 加 25% 加工费，意味着“买材料 → 合成 → 卖产物”恒定亏损
#  （0.5 × 1.25 = 0.625 < 1），且这条性质对任意深度的合成链都成立。
#  天然产出（矿石、花草、树叶、怪物掉落、结构战利品）无法递推，逐条手工定锚。
#
#  【三类 doctor 看不见的漏洞，已单独处理】
#   1. 时运挖矿：所有 *_ORE 与硫磺尖刺 buy: 0（只回收不出售），
#      玩家无法“买矿石 + 时运镐”把 1 份矿变成 4 份掉落。
#   2. 破方块掉落：沙砾→燧石、萤石→萤石粉、紫水晶簇→碎片、海晶灯→水晶、
#      西瓜→瓜片、书架→书、雪块→雪球、粘土→粘土球、树脂块→树脂，
#      逐个校验“方块买价 ≥ 时运 III 上限掉落的卖价”。
#   3. 熔炉/切石机：与合成同样纳入 /fsa doctor 的配方复核。
#
#  改价后必须跑 /fsa doctor：它用服务器自己的配方表复核每条卖出价。
#  当前状态：ERROR 0，WARN 37（全部是“原料是只回收的矿石，商店不出售”）。
#
#  daily-buy / daily-sell = 每名玩家每日限额（件），0 = 不限
#  dynamic.enabled        = 该商品价格随交易量浮动（买入推高、卖出压低）
#
#  【玩法保护:解锁与终身限售】
#  unlock-by-sell: true  该商品对某玩家上锁,直到他向商店卖出过 1 个;
#                        之后永久解锁购买。目的是保住"自己搞到它"这段玩法
#                        (末地城打潜影贝、召唤凋灵、下远古城)不被商店抹掉,
#                        同时不剥夺之后的便利性购买。要求 sell > 0。
#  lifetime-sell: N      每名玩家终身最多卖出 N 个,永不重置(区别于 daily-sell)。
#                        用于可再生的农场产物:允许兑现一次,不允许当印钞机。
#  两者共用同一份终身计数(存档 sold-ever 段),只对声明了它们的行写盘。
#  注意:给某行后加 unlock-by-sell 会让所有老玩家重新上锁(他们过去的卖出
#  没有被记录);管理员可用 /fsa resetunlock <玩家> 清除某人的终身计数。
# ===========================================================================

dynamic-defaults:
  enabled: false
  # 每交易 1 件物品，行情变动的基点数（100 基点 = 1%）
  step-bp: 2
  floor-percent: 50
  ceil-percent: 200
  # 每小时向 100% 回归的基点数
  recover-bp-per-hour: 300

