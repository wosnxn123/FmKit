# ===========================================================================
#  附魔书 —— 128 行（43 种附魔 × 各自等级）由本区段展开，不在 items: 表里手写
#
#  为什么不手写：128 行手写必然互相矛盾，而且游戏加一个附魔（26.2 加了 lunge）
#  表里就静静缺一行，没人会发现。所以价格来自曲线，曲线里的稀有度取原版自己的数据：
#
#     sell = base-sell × 等级^level-exponent × rarity^rarity-exponent × 诅咒系数
#     buy  = sell × buy-multiplier
#
#  rarity 默认取原版的 Enchantment#getAnvilCost()（1 / 2 / 4 / 8）：它本来就是
#  “价值倍率”，正好是 getWeight()（10 / 5 / 2 / 1）的倒数，也是 API 里唯一
#  表达“更值钱”而不只是“更少见”的量。只靠等级的曲线在这三个上会错得很离谱：
#  精准采集、无限、引雷都是最高一级且非宝藏，等级曲线把它们标成锋利 I 的价，
#  而原版给这三个 anvil 8。
#
#  下面 overrides 里的 rarity 是“原版稀有度和玩家实际需求不一致”的地方。
#  改 rarity 而不是直接写死 sell，是为了保住该附魔的等级曲线（写死 sell 会把
#  I..V 全压成一个价）。overrides 也接受 SHARPNESS/5 这种只改单个等级的写法，
#  以及 buy / sell / daily-buy / daily-sell / lifetime-sell / unlock-by-sell / max-level。
#
#  展开结果：128 行，全表 sell 合计 31040（= 每名玩家终身能从附魔书套现的上限）。
#  最贵：灵魂疾行 III / 迅捷潜行 III 买 7457（只出自远古城，商店买不到替代品）、
#  致密 IV 6080、穿透 V 4443、经验修补 I 3600、锋利 V 2221。
# ===========================================================================
enchanted-books:
  enabled: true
  category: enchants
  base-sell: 24
  level-exponent: 1.7
  rarity-exponent: 1
  buy-multiplier: 6
  # 诅咒也上架（不留空洞，免得看起来像 bug），但只值四分之一
  curse-multiplier: 0.25

  # 终身限售 1 本，必须保留：治好的僵尸村民图书管理员能用 1 颗绿宝石换一本
  # 可交易附魔书（原版 tradeable 标签，含经验修补）。不限售就是无上限刷钱。
  lifetime-sell: 1
  # 与上一行配合：卖出 1 本后该行永久解锁购买 —— 一次性套现，之后随便买。
  # 目的是保住“自己附魔 / 自己找村民换”这段玩法不被商店抹掉。
  unlock-by-sell: true

  overrides:
    # 经验修补：原版 anvil 只有 4，但它是唯一不可再生、且人人都要的附魔
    MENDING:            { rarity: 25 }
    # 荆棘 anvil 8 是因为附魔台上少见，不是因为强；实战里没人抢
    THORNS:             { rarity: 0.75 }
    # 穿刺只对水生生物有效，5 级的曲线会把它顶到锋利 V 之上
    IMPALING:           { rarity: 0.55 }
    # 爆炸保护 anvil 4 = 摔落保护的 4 倍，用途却窄得多
    BLAST_PROTECTION:   { rarity: 1.2 }
    # 亡灵杀手 / 节肢杀手 anvil 2 = 锋利的 2 倍，实战里严格弱于锋利。
    # 不压下来就会出现“更弱的附魔更贵”的倒挂
    SMITE:              { rarity: 0.5 }
    BANE_OF_ARTHROPODS: { rarity: 0.4 }

