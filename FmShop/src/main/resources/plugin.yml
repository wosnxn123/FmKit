name: FmShop
version: 1.0.0
main: dev.fm.shop.FmShopPlugin
api-version: '26.2'
folia-supported: true
description: Server shop and economy - buy/sell items at configured prices.
author: Fm
commands:
  fmshop:
    description: Open the shop menu.
    permission: fmshop.use
    aliases: [fsh]
    usage: /<command> [buy|sell [hand|inv]|price <item>|balance|pay <player> <amount>|help]
  fmshopadmin:
    description: FmShop admin commands.
    permission: fmshop.admin
    aliases: [fsa]
    usage: /<command> <give|take|set <player> <amount>|price <item> <buy> <sell>|market <item> [reset]|resetlimit <player|*>|tax [take <player> <amount>]|audit [player] [n]|doctor|status|reload|help>
permissions:
  fmshop.use:
    description: Use the shop.
    default: true
  fmshop.pay:
    description: Transfer money to other players.
    default: true
  fmshop.fee.exempt:
    description: Exempt from shop transaction fees.
    default: false
  fmshop.admin:
    description: Manage FmShop.
    default: op
